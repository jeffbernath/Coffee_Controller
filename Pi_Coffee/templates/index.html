<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Controller</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="controller">
    <header class="header">
      <div>id="tare-button"
        <h1>Coffee Controller</h1>
        <p class="subtitle">Pico I/O Test Console</p>
      </div>
      <div class="status-row">
        <span id="pico-indicator" class="indicator offline"></span>
        <span id="pico-status">Pico: OFFLINE</span>
      </div>
    </header>

    <section aria-labelledby="load-cells-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">INPUTS</p>
          <h2 id="load-cells-title">Load Cells</h2>
        </div>
        <div id="load-cell-actions"></div>
      </div>
      <div id="load-cell-grid" class="load-cell-grid"></div>
    </section>

    <section class="panel" aria-labelledby="outputs-title">
      <div class="section-heading compact">
        <div>
          <p class="eyebrow">OUTPUTS</p>
          <h2 id="outputs-title">LED Controls</h2>
        </div>
      </div>
      <div id="output-controls" class="control-list"></div>
    </section>

    <section class="panel" aria-labelledby="inputs-title">
      <div class="section-heading compact">
        <div>
          <p class="eyebrow">DIGITAL</p>
          <h2 id="inputs-title">Input Status</h2>
        </div>
      </div>
      <div id="input-status" class="input-list"></div>
    </section>

    <p id="command-message" class="command-message" role="status" aria-live="polite"></p>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
