<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Controller</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="controller">
    <h1>Coffee Controllers</h1>
    <section class="weight-panel"><div id="weight" class="weight">0.00 g</div></section>
    <button id="tare-button" class="tare-button" type="button">TAE</button>
    <div class="status-row">
      <span id="pico-indicator" class="indicator offline"></span>
      <span id="pico-status">Pico: OFFLINE</span>
    </div>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
